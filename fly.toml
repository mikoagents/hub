app = 'paseo-cloud'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  MIKO_HUB_APP_URL = 'https://hub.paseo.sh'
  MIKO_HUB_TRUSTED_CLIENT_IP_HEADER = 'fly-client-ip'
  MIKO_REGISTRATION_MODE = 'open'
  MIKO_ORGANIZATION_CREATION = 'open'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
